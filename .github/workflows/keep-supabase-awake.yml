name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          RAW_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase..."

          SUPABASE_URL=$(echo "$RAW_SUPABASE_URL" | tr -d '[:space:]')

          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ Error: SUPABASE_URL secret is empty"
            exit 1
          fi

          echo "Sanitized URL received"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -L "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase is awake"
          else
            echo "⚠️ Ping failed"
            exit 1
          fi