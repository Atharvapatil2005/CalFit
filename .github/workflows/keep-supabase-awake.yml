name: Keep Supabase Awake

on:
  schedule:
    # Monday + Thursday at 9:00 UTC
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase health endpoint
        run: |
          echo "Pinging Supabase..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -L "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Supabase is awake"
          else
            echo "⚠️ Ping failed (status: $STATUS)"
          fi